    <script>
        // List your video files here
        const videos = [
            "assets/videos/clear.mp4",
            "assets/videos/video2.mp4", // Add your second video here
            "assets/videos/video3.mp4"  // Add your third video here
        ];

        let currentVideo = 0;
        const videoElement = document.getElementById('bg-video');

        // When one video ends, play the next one
        videoElement.addEventListener('ended', () => {
            currentVideo = (currentVideo + 1) % videos.length; // Loop back to start
            videoElement.src = videos[currentVideo];
            videoElement.play();
        });
        
        // Note: Since 'loop' is on in HTML, it will loop the SAME video. 
        // If you want to cycle different videos, remove the 'loop' attribute in HTML above.
    </script>
